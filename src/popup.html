<!DOCTYPE html>
<html>
<head>
  <title>DOM Printer</title>
  <style>
    body {
      width: 300px;
      font-family: Arial, sans-serif;
      padding: 10px;
    }
    .status {
      text-align: center;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .status-found {
      color: green;
    }
    .status-not-found {
      color: red;
    }
    .button-container {
      text-align: center;
      margin: 15px 0;
    }
    button {
      background-color: #4285f4;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #3367d6;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .settings-link {
      display: block;
      text-align: center;
      margin-top: 10px;
      color: #4285f4;
      text-decoration: none;
    }
    .settings-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="status" id="status">Checking page...</div>
  <div class="button-container">
    <button id="print-button" disabled>Print Selected Content</button>
  </div>
  <a href="#" id="settings-link" class="settings-link">Settings</a>
  <script src="popup.js"></script>
</body>
</html>
